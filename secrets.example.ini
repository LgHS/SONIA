; Modèle — copier en "secrets.ini" (ignoré par git) et mettre le mot de passe OTA
; identique à OTA_PASSWORD de include/secrets.h.
; Téléversement sans fil : pio run -e ota -t upload
[env:ota]
extends = env:d1_mini_pro
upload_protocol = espota
upload_port = sonia.local
upload_flags = --auth=mot_de_passe_ota
